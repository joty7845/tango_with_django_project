{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Rango</title>
</head>

<body>
    <h1>Rango says...</h1>

    <img src="{% static 'images/rango.jpg' %}" alt="Rango">

    <div>
        hey there partner! <br />
        <strong>{{ boldmessage }}</strong>
    </div>

    <div>
        <a href="/rango/about/">About</a>
    </div>

    <div>
        {% if categories %}
            <ul>
                {% for category in categories %}
                    <li>{{ category.name }} - {{ category.likes }} likes</li>
                {% endfor %}
            </ul>
        {% else %}
            <strong>No categories present.</strong>
        {% endif %}
    </div>

</body>
</html>
