<!DOCTYPE html>
<html>
<head>
    <title>Rango</title>
</head>

<body>
    {% if category %}
        <h1>{{ category.name }}</h1>

        {% if pages %}
            <ul>
                {% for page in pages %}
                    <li><a href="{{ page.url }}">{{ page.title }}</a></li>
                {% endfor %}
            </ul>
        {% else %}
            <strong>No pages currently in category.</strong>
        {% endif %}
    {% else %}
        The specified category does not exist.
    {% endif %}

    {% if user.is_authenticated %}
    <a href="{% url 'add_page' category.slug %}">Add Page</a>
    {% endif %}

</body>
</html>
